<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛概模拟考试系统</title>
<style>
:root {
  --bg: #f0f2f5; --card: #fff; --primary: #1a73e8; --danger: #d93025;
  --success: #188038; --warning: #e37400; --text: #202124; --text2: #5f6368;
  --border: #dadce0; --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  --radius: 12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:16px}

/* Header */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.header h1{font-size:1.3em;font-weight:700;color:var(--primary)}
.header-nav{display:flex;gap:8px;flex-wrap:wrap}
.header-nav button{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:0.9em;transition:all .2s}
.header-nav button:hover{border-color:var(--primary);color:var(--primary)}
.header-nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.15em;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--primary);display:flex;align-items:center;gap:8px}
.card h3{font-size:1em;margin:16px 0 8px;color:var(--primary)}

/* Progress */
.progress-bar{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.progress-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.7em;cursor:pointer;transition:all .2s;background:#fff}
.progress-dot.answered{background:var(--primary);color:#fff;border-color:var(--primary)}
.progress-dot.current{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.3)}
.progress-dot.flagged{border-color:var(--warning)}
.stats-row{display:flex;gap:24px;flex-wrap:wrap;font-size:0.9em;color:var(--text2);margin-bottom:12px}

/* Question */
.question-block{margin-bottom:24px}
.question-num{display:inline-block;background:var(--primary);color:#fff;padding:2px 10px;border-radius:12px;font-size:0.85em;margin-bottom:8px}
.question-type{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.8em;margin-left:6px;font-weight:600}
.type-single{background:#e8f0fe;color:var(--primary)}
.type-multi{background:#fce8e6;color:var(--danger)}
.type-judge{background:#e6f4ea;color:var(--success)}
.question-text{font-size:1.05em;margin:8px 0 12px;font-weight:500}
.option{margin:6px 0;padding:10px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:10px}
.option:hover{border-color:var(--primary);background:#f8fbff}
.option.selected{border-color:var(--primary);background:#e8f0fe;font-weight:500}
.option.correct{border-color:var(--success);background:#e6f4ea}
.option.wrong{border-color:var(--danger);background:#fce8e6}
.option-label{font-weight:700;min-width:24px;color:var(--primary)}
.option input[type="radio"],.option input[type="checkbox"]{margin-top:3px;cursor:pointer}

/* Buttons */
.btn{padding:10px 24px;border:none;border-radius:20px;font-size:0.95em;cursor:pointer;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1557b0;box-shadow:0 2px 8px rgba(26,115,232,.3)}
.btn-outline{background:#fff;border:2px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:#e8f0fe}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-group{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}

/* Analysis */
.analysis-box{margin-top:8px;padding:12px 16px;background:#f8f9fa;border-radius:8px;border-left:4px solid var(--primary)}
.analysis-box h4{font-size:0.9em;color:var(--primary);margin-bottom:4px}
.analysis-box p{font-size:0.9em;color:var(--text2)}
.wrong-tag{color:var(--danger);font-weight:700}
.right-tag{color:var(--success);font-weight:700}

/* Error Notebook */
.error-group{margin-bottom:16px}
.error-group h3{cursor:pointer;padding:10px 14px;background:#f8f9fa;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.error-group h3:hover{background:#e8f0fe}
.error-chapter{margin-left:8px;padding:4px 10px;background:var(--primary);color:#fff;border-radius:12px;font-size:0.8em}
.error-count{font-size:0.85em;color:var(--danger);font-weight:700}
.error-item{padding:10px 14px;margin:4px 0;border-radius:8px;background:#fff5f5;border:1px solid #fce8e6;font-size:0.9em}
.error-item .topic-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:0.75em;background:#fce8e6;color:var(--danger);margin-right:6px}

/* Score */
.score-circle{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;font-weight:700;border:6px solid}
.score-circle.excellent{border-color:var(--success);color:var(--success)}
.score-circle.good{border-color:var(--primary);color:var(--primary)}
.score-circle.fair{border-color:var(--warning);color:var(--warning)}
.score-circle.poor{border-color:var(--danger);color:var(--danger)}
.score-num{font-size:2.5em}
.score-label{font-size:0.85em;color:var(--text2)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;text-align:center;margin:16px 0}
.summary-item{padding:12px;border-radius:8px;background:#f8f9fa}
.summary-item .num{font-size:1.5em;font-weight:700}
.summary-item .lbl{font-size:0.8em;color:var(--text2)}

/* Chapter weak analysis */
.chapter-bar{margin:6px 0;display:flex;align-items:center;gap:8px}
.chapter-bar .name{min-width:120px;font-size:0.85em}
.chapter-bar .bar-bg{flex:1;height:20px;background:#e8eaed;border-radius:10px;overflow:hidden}
.chapter-bar .bar-fill{height:100%;border-radius:10px;transition:width .5s}
.chapter-bar .pct{min-width:45px;font-size:0.85em;text-align:right}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:var(--radius);padding:32px;max-width:500px;width:90%;text-align:center}
.modal h2{margin-bottom:12px}
.modal p{margin-bottom:20px;color:var(--text2)}

/* Responsive */
@media(max-width:600px){
  .header h1{font-size:1.1em}
  .card{padding:16px}
  .option{padding:8px 10px}
  .score-circle{width:90px;height:90px}
  .score-num{font-size:1.8em}
}
.hidden{display:none!important}

/* Tab active in analysis */
.tab-bar{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab-bar button{padding:8px 14px;border:1px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;font-size:0.85em}
.tab-bar button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>

<div class="header">
  <h1>毛概模拟考试系统</h1>
  <div class="header-nav">
    <button onclick="showPage('home')" id="nav-home" class="active">模拟考试</button>
    <button onclick="showPage('analysis')" id="nav-analysis">历史成绩</button>
    <button onclick="showPage('errors')" id="nav-errors">错题本 <span id="err-badge" style="background:var(--danger);color:#fff;padding:1px 7px;border-radius:10px;font-size:.75em;margin-left:4px">0</span></button>
    <button onclick="resetAll()" style="border-color:var(--danger);color:var(--danger)">重置数据</button>
  </div>
</div>

<div class="container">

<!-- ========== HOME PAGE ========== -->
<div id="page-home">
  <div class="card" style="text-align:center">
    <h2>模拟考试</h2>
    <p style="color:var(--text2);margin-bottom:16px">单选题 25 题（50分）+ 多选题 10 题（30分）+ 判断题 10 题（20分）<br>共 45 题，满分 100 分</p>
    <div id="exam-history" style="margin:12px 0;font-size:.9em;color:var(--text2)"></div>
    <button class="btn btn-primary" onclick="startExam()" style="font-size:1.1em;padding:14px 40px">开始考试</button>
    <p style="margin-top:10px;font-size:.85em;color:var(--text2)">
      第 <span id="exam-round">1</span> 套试卷 |
      <span id="smart-hint"></span>
    </p>
  </div>

  <div class="card" style="text-align:center">
    <h2>章节知识点掌握度</h2>
    <div id="chapter-mastery"></div>
    <p style="font-size:.85em;color:var(--text2);margin-top:8px">基于错题记录自动计算</p>
  </div>
</div>

<!-- ========== EXAM PAGE ========== -->
<div id="page-exam" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <h2 id="exam-title" style="border:none;margin:0">模拟考试</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="timer" style="font-weight:700;font-size:1.1em"></span>
        <button class="btn btn-outline" onclick="flagQuestion()" style="font-size:.85em">标记待定</button>
        <button class="btn btn-danger" onclick="submitExam()">交卷</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="progress-bar" id="progress-dots"></div>
    <div class="stats-row">
      <span>已答: <strong id="answered-count">0</strong>/45</span>
      <span>标记: <strong id="flagged-count">0</strong></span>
    </div>
  </div>

  <div class="card" id="question-container"></div>

  <div class="btn-group" style="justify-content:space-between">
    <button class="btn btn-outline" id="btn-prev" onclick="prevQuestion()">上一题</button>
    <span style="color:var(--text2);font-size:.9em" id="q-pos">1/45</span>
    <button class="btn btn-outline" id="btn-next" onclick="nextQuestion()">下一题</button>
  </div>
</div>

<!-- ========== RESULT PAGE ========== -->
<div id="page-result" class="hidden">
  <div class="card" style="text-align:center">
    <h2>考试成绩</h2>
    <div id="score-display"></div>
    <div class="summary-grid" id="summary-grid"></div>
    <button class="btn btn-primary" onclick="viewFullAnalysis()">查看详细解析</button>
    <button class="btn btn-outline" onclick="showPage('home');refreshHome()" style="margin-left:8px">返回首页</button>
  </div>
</div>

<!-- ========== ANALYSIS PAGE ========== -->
<div id="page-analysis" class="hidden">
  <div class="card">
    <h2>历史成绩记录</h2>
    <div id="history-list"><p style="color:var(--text2)">暂无记录</p></div>
  </div>
</div>

<!-- ========== FULL ANALYSIS PAGE ========== -->
<div id="page-full-analysis" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h2 style="border:none;margin:0">详细解析</h2>
      <button class="btn btn-outline" onclick="showPage('home');refreshHome()">返回首页</button>
    </div>
    <div class="tab-bar" id="analysis-tabs"></div>
  </div>
  <div id="analysis-content"></div>
</div>

<!-- ========== ERROR NOTEBOOK PAGE ========== -->
<div id="page-errors" class="hidden">
  <div class="card">
    <h2>错题本</h2>
    <p style="color:var(--text2);margin-bottom:12px">按知识点体系整理，帮助你针对性复习薄弱环节</p>
    <div id="error-notebook"><p style="color:var(--text2)">暂无错题记录</p></div>
    <button class="btn btn-primary" onclick="retestErrors()" id="btn-retest" style="display:none">针对错题重新练习</button>
  </div>
</div>

</div>

// ===================== APP STATE =====================
const STORAGE_KEY = 'maogai_exam_system';
let appState = {
  exams: [],           // history of completed exams
  errors: [],          // all wrong answers {qid, date, topic}
  currentExam: null,   // {questions[], answers[], startTime}
  currentQIdx: 0,      // index in shuffled exam
  flagged: new Set()   // flagged question indices
};

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    appState.exams = parsed.exams || [];
    appState.errors = parsed.errors || [];
    appState.flagged = new Set();
  }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    exams: appState.exams.slice(-20),
    errors: appState.errors
  }));
  updateErrorBadge();
}
function resetAll() {
  if (confirm('确定要清空所有考试记录和错题数据吗？此操作不可恢复。')) {
    appState.exams = [];
    appState.errors = [];
    localStorage.removeItem(STORAGE_KEY);
    showPage('home');
    refreshHome();
    updateErrorBadge();
  }
}

// ===================== EXAM GENERATION =====================
function generateExam() {
  // Step 1: Analyze error patterns
  const errorTopics = {};
  const errorChapters = {};
  appState.errors.forEach(e => {
    const q = QUESTION_BANK.find(q => q.id === e.qid);
    if (q) {
      errorTopics[q.topic] = (errorTopics[q.topic] || 0) + 1;
      errorChapters[q.ch] = (errorChapters[q.ch] || 0) + 1;
    }
  });

  // Step 2: For subsequent exams, bias towards weak areas
  const isFirstExam = appState.exams.length === 0;

  // Get all questions grouped by type
  const singles = QUESTION_BANK.filter(q => q.type === 'single');
  const multis = QUESTION_BANK.filter(q => q.type === 'multi');
  const judges = QUESTION_BANK.filter(q => q.type === 'judge');

  // Score each question: higher score = more likely to be selected
  function questionScore(q) {
    let score = 1;
    // Base weight from error count on this topic
    if (errorTopics[q.topic]) score += errorTopics[q.topic] * 3;
    if (errorChapters[q.ch]) score += errorChapters[q.ch] * 2;
    // Add some randomness
    score += Math.random() * 3;
    // Slight preference for higher difficulty on retests
    if (!isFirstExam) score += q.diff * 0.5;
    return score;
  }

  // Select questions with weighted random sampling
  function selectQuestions(pool, count) {
    const scored = pool.map(q => ({q, score: questionScore(q)}));
    scored.sort((a, b) => b.score - a.score);
    // Take top 70% by score, then shuffle to avoid always same order
    const topN = Math.max(count, Math.floor(scored.length * 0.7));
    const candidates = scored.slice(0, topN);
    // Shuffle
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    return candidates.slice(0, count).map(c => c.q);
  }

  const selected = [
    ...selectQuestions(singles, 25),
    ...selectQuestions(multis, 10),
    ...selectQuestions(judges, 10)
  ];

  // Shuffle within type groups to mix chapters
  function shuffleGroup(arr, start, end) {
    const group = arr.slice(start, end);
    for (let i = group.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [group[i], group[j]] = [group[j], group[i]];
    }
    for (let i = start; i < end; i++) arr[i] = group[i - start];
  }
  shuffleGroup(selected, 0, 25);
  shuffleGroup(selected, 25, 35);
  shuffleGroup(selected, 35, 45);

  return selected;
}

// ===================== PAGES =====================
function showPage(page) {
  ['home','exam','result','analysis','errors','full-analysis'].forEach(p => {
    document.getElementById('page-'+p).classList.add('hidden');
  });
  const el = document.getElementById('page-'+page);
  if (el) el.classList.remove('hidden');

  ['home','analysis','errors'].forEach(p => {
    const btn = document.getElementById('nav-'+p);
    if (btn) btn.classList.toggle('active', p === page);
  });

  if (page === 'home') refreshHome();
  if (page === 'errors') renderErrors();
  if (page === 'analysis') renderHistory();
}

// ===================== HOME =====================
function refreshHome() {
  document.getElementById('exam-round').textContent = appState.exams.length + 1;
  const hint = document.getElementById('smart-hint');
  if (appState.errors.length > 0) {
    hint.textContent = '智能模式：将侧重你之前的薄弱知识点';
    hint.style.color = 'var(--danger)';
  } else {
    hint.textContent = '随机模式：全面覆盖所有知识点';
    hint.style.color = 'var(--text2)';
  }
  renderExamHistory();
  renderChapterMastery();
}

function renderExamHistory() {
  const div = document.getElementById('exam-history');
  if (appState.exams.length === 0) {
    div.innerHTML = '<p style="color:var(--text2)">尚未进行任何考试</p>';
    return;
  }
  const last = appState.exams[appState.exams.length - 1];
  div.innerHTML = '最近考试：<strong>' + last.score + '分</strong> (' +
    new Date(last.date).toLocaleDateString() + ') | 共完成 <strong>' + appState.exams.length + '</strong> 次考试';
}

function renderChapterMastery() {
  const div = document.getElementById('chapter-mastery');
  const chapters = [...new Set(QUESTION_BANK.map(q => q.ch))];

  // Calculate mastery per chapter
  const chapterData = {};
  chapters.forEach(ch => {
    const chQuestions = QUESTION_BANK.filter(q => q.ch === ch);
    const chErrors = appState.errors.filter(e => {
      const q = QUESTION_BANK.find(q => q.id === e.qid);
      return q && q.ch === ch;
    });
    const totalAttempts = chQuestions.length; // proxy
    const errorCount = new Set(chErrors.map(e => e.qid)).size;
    const mastery = Math.max(0, Math.min(100, Math.round((1 - errorCount / Math.max(chQuestions.length, 1)) * 100)));
    chapterData[ch] = { mastery, errors: errorCount, total: chQuestions.length };
  });

  if (appState.errors.length === 0) {
    div.innerHTML = '<p style="color:var(--text2);text-align:center;padding:20px">完成考试后，将显示各章节掌握度分析</p>';
    return;
  }

  div.innerHTML = chapters.map(ch => {
    const d = chapterData[ch];
    const color = d.mastery >= 80 ? 'var(--success)' : d.mastery >= 50 ? 'var(--warning)' : 'var(--danger)';
    return '<div class="chapter-bar">' +
      '<span class="name">' + ch + '</span>' +
      '<span class="bar-bg"><span class="bar-fill" style="width:' + d.mastery + '%;background:' + color + '"></span></span>' +
      '<span class="pct" style="color:' + color + '">' + d.mastery + '%</span>' +
      '</div>';
  }).join('');
}

// ===================== EXAM =====================
function startExam() {
  appState.currentExam = {
    questions: generateExam(),
    answers: new Array(45).fill(null), // null=unanswered, [] for multi, [idx] for single/judge
    startTime: Date.now(),
    flagged: new Set()
  };
  // Init multi-select answers as empty arrays
  appState.currentExam.questions.forEach((q, i) => {
    if (q.type === 'multi') appState.currentExam.answers[i] = [];
  });
  appState.flagged = new Set();
  appState.currentQIdx = 0;
  showPage('exam');
  updateTimer();
  if (!appState._timerInterval) {
    appState._timerInterval = setInterval(updateTimer, 1000);
  }
  renderQuestion();
  renderProgress();
}

let _timerSeconds = 0;
function updateTimer() {
  if (!appState.currentExam) return;
  const elapsed = Math.floor((Date.now() - appState.currentExam.startTime) / 1000);
  _timerSeconds = elapsed;
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  const el = document.getElementById('timer');
  if (el) el.textContent = '⏱ ' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function renderQuestion() {
  const exam = appState.currentExam;
  if (!exam) return;
  const idx = appState.currentQIdx;
  const q = exam.questions[idx];
  const container = document.getElementById('question-container');
  const typeLabel = q.type === 'single' ? '单选题' : q.type === 'multi' ? '多选题' : '判断题';
  const typeClass = q.type === 'single' ? 'type-single' : q.type === 'multi' ? 'type-multi' : 'type-judge';
  const inputType = q.type === 'multi' ? 'checkbox' : 'radio';
  const answer = exam.answers[idx];

  const isFlagged = appState.flagged.has(idx);

  let html = '<div class="question-block">';
  html += '<span class="question-num">第 ' + (idx + 1) + ' 题</span>';
  html += '<span class="question-type ' + typeClass + '">' + typeLabel + '</span>';
  if (isFlagged) html += ' <span style="color:var(--warning);font-size:.8em">已标记</span>';
  html += '<div class="question-text">' + q.q + '</div>';

  const qOpts = (q.opts && q.opts.length > 0) ? q.opts : (q.type === 'judge' ? ['正确', '错误'] : []);
  const labels = q.type === 'judge' ? ['正确', '错误'] :
    ['A', 'B', 'C', 'D', 'E'].slice(0, qOpts.length);

  qOpts.forEach((opt, oi) => {
    let selClass = '';
    if (q.type === 'multi') {
      if (Array.isArray(answer) && answer.includes(oi)) selClass = ' selected';
    } else {
      if (answer !== null && answer[0] === oi) selClass = ' selected';
    }
    html += '<div class="option' + selClass + '" onclick="selectOption(' + idx + ',' + oi + ')">';
    html += '<span class="option-label">' + labels[oi] + '.</span>';
    html += '<input type="' + inputType + '" name="q' + idx + '" value="' + oi + '"' + (selClass ? ' checked' : '') + ' onclick="event.stopPropagation();selectOption(' + idx + ',' + oi + ')">';
    html += '<span>' + opt + '</span>';
    html += '</div>';
  });

  if (q.type === 'multi') {
    html += '<p style="font-size:.8em;color:var(--text2);margin-top:4px">提示：本题为多选题，可选择多个答案</p>';
  }

  html += '</div>';
  container.innerHTML = html;
  document.getElementById('q-pos').textContent = (idx + 1) + '/45';
  document.getElementById('btn-prev').style.visibility = idx === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-next').style.visibility = idx === 44 ? 'hidden' : 'visible';
  updateAnsweredCount();
}

function selectOption(qIdx, optIdx) {
  const exam = appState.currentExam;
  const q = exam.questions[qIdx];
  if (q.type === 'multi') {
    if (!Array.isArray(exam.answers[qIdx])) exam.answers[qIdx] = [];
    const arr = exam.answers[qIdx];
    const pos = arr.indexOf(optIdx);
    if (pos >= 0) arr.splice(pos, 1);
    else arr.push(optIdx);
  } else {
    exam.answers[qIdx] = [optIdx];
  }
  renderQuestion();
  renderProgress();
}

function flagQuestion() {
  const idx = appState.currentQIdx;
  if (appState.flagged.has(idx)) appState.flagged.delete(idx);
  else appState.flagged.add(idx);
  appState.currentExam.flagged = appState.flagged;
  renderQuestion();
  renderProgress();
}

function nextQuestion() {
  if (appState.currentQIdx < 44) {
    appState.currentQIdx++;
    renderQuestion();
    renderProgress();
  }
}
function prevQuestion() {
  if (appState.currentQIdx > 0) {
    appState.currentQIdx--;
    renderQuestion();
    renderProgress();
  }
}

function renderProgress() {
  const exam = appState.currentExam;
  if (!exam) return;
  const dots = document.getElementById('progress-dots');
  let html = '';
  for (let i = 0; i < 45; i++) {
    let cls = '';
    if (i === appState.currentQIdx) cls = 'current';
    const ans = exam.answers[i];
    const answered = Array.isArray(ans) ? ans.length > 0 : ans !== null;
    if (answered) cls += ' answered';
    if (appState.flagged.has(i)) cls += ' flagged';
    html += '<div class="progress-dot ' + cls + '" onclick="appState.currentQIdx=' + i + ';renderQuestion();renderProgress()" title="第'+(i+1)+'题">' + (i+1) + '</div>';
  }
  dots.innerHTML = html;
}

function updateAnsweredCount() {
  const exam = appState.currentExam;
  if (!exam) return;
  let count = 0;
  exam.answers.forEach(a => {
    if (Array.isArray(a) && a.length > 0) count++;
    else if (a !== null && !Array.isArray(a)) count++;
    else if (a !== null && Array.isArray(a) && a.length > 0) count++;
    else if (a !== null) count++;
  });
  // More accurate count
  count = 0;
  exam.answers.forEach(a => {
    if (a === null) return;
    if (Array.isArray(a) && a.length > 0) count++;
    else if (!Array.isArray(a) && a !== null) count++;
  });
  document.getElementById('answered-count').textContent = count;
  document.getElementById('flagged-count').textContent = appState.flagged.size;
}

// ===================== SUBMIT =====================
function submitExam() {
  const exam = appState.currentExam;
  if (!exam) return;

  const unanswered = exam.answers.filter(a => {
    if (a === null) return true;
    if (Array.isArray(a) && a.length === 0) return true;
    return false;
  }).length;

  if (unanswered > 0) {
    if (!confirm('还有 ' + unanswered + ' 题未作答，确定交卷吗？')) return;
  }

  // Grade
  let correctCount = 0;
  const details = [];
  const newErrors = [];

  exam.questions.forEach((q, i) => {
    const userAns = exam.answers[i] || [];
    const correctAns = q.ans;
    let isCorrect = false;

    if (q.type === 'multi') {
      const userSet = new Set(userAns || []);
      const correctSet = new Set(correctAns);
      isCorrect = userSet.size === correctSet.size && [...userSet].every(v => correctSet.has(v));
      if (userAns.length === 1 && userAns[0] === null) isCorrect = false;
    } else {
      isCorrect = (userAns[0] !== undefined && userAns[0] !== null && userAns[0] === correctAns[0]);
    }

    if (isCorrect) correctCount++;
    else {
      newErrors.push({
        qid: q.id,
        date: Date.now(),
        topic: q.topic,
        ch: q.ch
      });
    }

    details.push({ q, userAns: userAns || [], isCorrect });
  });

  // Calculate scores
  const singleCorrect = details.slice(0, 25).filter(d => d.isCorrect).length;
  const multiCorrect = details.slice(25, 35).filter(d => d.isCorrect).length;
  const judgeCorrect = details.slice(35, 45).filter(d => d.isCorrect).length;
  const totalScore = singleCorrect * 2 + multiCorrect * 3 + judgeCorrect * 2;

  const result = {
    date: Date.now(),
    score: totalScore,
    correct: correctCount,
    total: 45,
    singleCorrect, multiCorrect, judgeCorrect,
    details,
    timeSeconds: _timerSeconds
  };

  appState.exams.push(result);
  appState.errors.push(...newErrors);
  saveState();

  // Reset exam state
  appState.currentExam = null;
  appState.flagged = new Set();

  // Show result
  showResult(result);
}

    '<div class="score-circle ' + cls + '">' +

function renderErrors() {
  const div = document.getElementById('error-notebook');
  const btn = document.getElementById('btn-retest');

  if (appState.errors.length === 0) {
    div.innerHTML = '<p style="color:var(--success);text-align:center;padding:24px;font-size:1.1em">暂无错题记录，继续保持！</p>';
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'inline-flex';

  // Group errors by chapter and topic
  const grouped = {};
  appState.errors.forEach(e => {
    const q = QUESTION_BANK.find(q => q.id === e.qid);
    if (!q) return;
    const key = q.ch + ' > ' + q.topic;
    if (!grouped[key]) grouped[key] = { ch: q.ch, topic: q.topic, errors: [] };
    // Avoid duplicate questions in same group
    if (!grouped[key].errors.find(x => x.id === q.id)) {
      grouped[key].errors.push({...q, errorCount: 1});
    } else {
      grouped[key].errors.find(x => x.id === q.id).errorCount++;
    }
  });

  // Sort by error count
  const sorted = Object.values(grouped).sort((a, b) => {
    const aTotal = a.errors.reduce((s, e) => s + e.errorCount, 0);
    const bTotal = b.errors.reduce((s, e) => s + e.errorCount, 0);
    return bTotal - aTotal;
  });

  let html = '';
  sorted.forEach(group => {
    const totalErrors = group.errors.reduce((s, e) => s + e.errorCount, 0);
    html += '<div class="error-group">';
    html += '<h3>' + group.topic +
      '<span class="error-chapter">' + group.ch + '</span>' +
      '<span class="error-count">' + totalErrors + ' 次错误</span></h3>';
    html += '<div>';
    group.errors.forEach(q => {
      html += '<div class="error-item">';
      html += '<span class="topic-tag">' + q.type + '</span>';
      html += '<strong>Q:</strong> ' + q.q.substring(0, 80) + (q.q.length > 80 ? '...' : '');
      html += '<br><span style="color:var(--text2);font-size:.85em">答案: ' +
        (q.type==='judge' ? (q.ans[0]===0?'正确':'错误') : q.ans.map(a => 'ABCDE'[a]).join('')) +
        ' | ' + q.explain.substring(0, 60) + '...</span>';
      html += '<br><span style="color:var(--danger);font-size:.8em">错误 ' + q.errorCount + ' 次</span>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  div.innerHTML = html;
}

function retestErrors() {
  if (appState.errors.length === 0) return;

  // Get unique error question IDs
  const errorQids = [...new Set(appState.errors.map(e => e.qid))];
  const errorQuestions = errorQids.map(id => QUESTION_BANK.find(q => q.id === id)).filter(Boolean);

  // Separate by type
  const errorSingles = errorQuestions.filter(q => q.type === 'single');
  const errorMultis = errorQuestions.filter(q => q.type === 'multi');
  const errorJudges = errorQuestions.filter(q => q.type === 'judge');

  // Fill with regular questions if not enough error questions
  function fillPool(errorPool, fullPool, target) {
    const result = [...errorPool];
    const usedIds = new Set(result.map(q => q.id));
    const remaining = fullPool.filter(q => !usedIds.has(q.id));
    // Shuffle remaining
    for (let i = remaining.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
    }
    result.push(...remaining.slice(0, target - result.length));
    // Shuffle result
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result.slice(0, target);
  }

  const singles = fillPool(errorSingles, QUESTION_BANK.filter(q => q.type === 'single'), 25);
  const multis = fillPool(errorMultis, QUESTION_BANK.filter(q => q.type === 'multi'), 10);
  const judges = fillPool(errorJudges, QUESTION_BANK.filter(q => q.type === 'judge'), 10);

  const questions = [...singles, ...multis, ...judges];

  appState.currentExam = {
    questions,
    answers: new Array(45).fill(null),
    startTime: Date.now(),
    flagged: new Set()
  };
  appState.currentExam.questions.forEach((q, i) => {
    if (q.type === 'multi') appState.currentExam.answers[i] = [];
  });
  appState.flagged = new Set();
  appState.currentQIdx = 0;
  showPage('exam');
  if (!appState._timerInterval) {
    appState._timerInterval = setInterval(updateTimer, 1000);
  }
  updateTimer();
  renderQuestion();
  renderProgress();
}
